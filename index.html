<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frac Stacker</title>
  <style>
    html, body {
      background: linear-gradient(135deg, #1799bb 0%, #00597d 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #f8fafb;
    }
    .main-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: 8vh;
    }
    .hero-title {
      font-size: 2.3rem;
      letter-spacing: 0.01em;
      text-align: center;
      font-weight: 900;
      margin-bottom: 18px;
      margin-top: 0;
      color: #fff;
      text-shadow: 0 4px 24px rgba(19,42,62,0.14);
      text-transform: uppercase;
    }
    .hero-sub {
      font-size: 1.14rem;
      text-align: center;
      margin: 0 0 33px 0;
      color: #fff2;
      letter-spacing: 0.01em;
      font-weight: 500;
    }
    .button-row {
      display: flex;
      gap: 18px;
      margin-bottom: 36px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .pill-btn {
      display: inline-block;
      padding: 14px 38px;
      font-size: 1.12em;
      background: linear-gradient(92deg,#68f7e9 0%,#278cf6 98%);
      color: #fff;
      border: none;
      border-radius: 36px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 11px rgba(57,199,235,0.14);
      transition: box-shadow .14s, background .18s, color .16s;
      margin: 0 0 0 0; white-space: nowrap;
    }
    .pill-btn:hover, .pill-btn:focus {
      background: linear-gradient(93deg,#86e2ab 0%,#62c7f7 97%);
      color: #2b3645;
    }
    .pill-btn.gift {
      background: linear-gradient(92deg,#ffe144,#ffa93c 98%);
      color: #213044;
    }
    .pill-btn.gift:hover, .pill-btn.gift:focus {
      background: linear-gradient(92deg,#ffeaa3,#ffd288 98%);
      color: #2b3645;
    }
    .pill-btn.club {
      background: linear-gradient(92deg,#1ee7eb,#2eff6b 98%);
      color: #215d25;
    }
    .pill-btn.club:hover, .pill-btn.club:focus {
      background: linear-gradient(92deg,#6ffe89,#a3f9ef 98%);
      color: #105522;
    }
    .signup-row {
      margin-top: 12px;
      text-align: center;
      font-size: 1.11em;
      color: #fff;
      font-weight: 500;
    }
    .signup-row a {
      color: #fff;
      text-decoration: underline;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 500px) {
      .main-wrap { padding-top: 2vh; }
      .hero-title { font-size: 1.16rem; }
      .button-row { flex-direction: column; gap: 12px; }
      .pill-btn { width: 100%; padding: 11px 0; }
    }
  </style>
</head>
<body>
  <div class="main-wrap">
    <h1 class="hero-title">STACK SILVER ONE GRAM AT A TIME</h1>
    <div class="hero-sub">Premium handmade 1-gram silver rounds. Tangible value.</div>
    <div class="button-row">
      <a href="collection.html" class="pill-btn">Browse Collection</a>
      <a href="gift.html" class="pill-btn gift">Send a Gram</a>
      <a href="subscription.html" class="pill-btn club">Monthly Club</a>
    </div>
    <div class="signup-row">Don't wait any longer to get into precious metals. Even a small monthly order adds up quick.<br>
      <a href="#" id="signup-cta">Sign up for offers and updates here.</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>

<head>

    body {

      color: #eceeed;

      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mockup-card {
      background: #23242a;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.28);
      max-width: 410px;
      width: 96vw;
      padding: 40px 18px 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mockup-image {
      width: 98%;
      height: 215px;
      object-fit: cover;
      background: #24262f;
      border-radius: 9px;
      margin-bottom: 24px;
      border: 1.5px solid #2e3037;
    }
    .muted-label {
      text-transform: uppercase;
      font-size: 0.87rem;
      letter-spacing: 0.13em;
      font-weight: 700;
      color: #86b3e5;
      margin-bottom: 7px;
    }
    .main-title {
      margin: 0 0 13px 0;
      font-size: 2rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #d3e7fb;
      text-align: center;
    }
    .desc {
      font-size: 1.08rem;
      color: #b0b0c2;
      text-align: center;
      margin-bottom: 38px;
      min-height: 50px;
    }
    .collection-btn, nav a {
      margin-top: auto;
      background: linear-gradient(92deg, #2e97ee 0%, #5bcbdf 100%);
      color: #fff;
      font-weight: 700;
      font-size: 1.13rem;
      padding: 15px 34px;
      border: none;
      border-radius: 40px;
      box-shadow: 0 2px 16px rgba(46,151,238,0.18);
      cursor: pointer;
      transition: background 0.18s, transform 0.13s;
      text-decoration: none;
      display: inline-block;
    }
    .collection-btn:hover, .collection-btn:focus, nav a:hover, nav a:focus {
      background: linear-gradient(94deg, #409fff 0%, #6ed8f7 90%);
      transform: translateY(-1px) scale(1.015);
    }
    nav {
      display: flex; gap: 16px; margin-top: 32px;
    }
    nav a:nth-child(2) {
      background: linear-gradient(92deg,#f2b52d,#ffc542); color:#23242a;
    }
    nav a:nth-child(3) {
      background: linear-gradient(92deg,#5bcbdf,#86c332); color:#23242a;
    }
    @media (max-width: 520px) {
      .mockup-card { padding: 20px 5vw; }
      .mockup-image { height: 143px; }
    }
  </style>

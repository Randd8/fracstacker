<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frac Stacker | Premium Fractional Silver Collectibles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #0d4858 50%, #1a5f7a 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #ffffff;
        }
        .utility-bar {
            background: #050d15;
            color: #9ca3af;
            padding: 8px 0;
            font-size: 12px;
            text-align: center;
        }
        .utility-bar a {
            color: #5eb3d1;
            text-decoration: none;
        }
        .main-header {
            background: #ffffff;
            padding: 0;
        }
        .logo-section {
            text-align: center;
            padding: 2px 0 2px 0;
            background: #ffffff;
        }
        .logo-section img {
            max-width: 98%;
            height: auto;
            max-height: 150px;
        }
        .search-row {
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 0;
        }
        .search-row .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .search-bar {
            flex: 0 0 55%;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 18px;
            background: #f5f5f5;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            color: #1a1a1a;
            font-size: 14px;
        }
        .search-bar input::placeholder {
            color: #999;
        }
        .header-actions {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .header-actions a {
            color: #0a1929;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .header-actions a:hover {
            color: #5eb3d1;
        }
        nav {
            background: #0a1929;
            padding: 12px 0;
        }
        nav .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 35px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active {
            color: #5eb3d1;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }
        .hero-banner {
            background: linear-gradient(90deg, #0a3d4a 0%, #1a5f7a 100%);
            padding: 50px 0;
            text-align: center;
        }
        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 35px 50px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }
        .hero-banner h1 {
            font-size: 42px;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        .hero-banner h1 .bold {
            font-weight: 700;
        }
        .hero-banner h1 .light {
            font-weight: 300;
        }
        .hero-banner p {
            font-size: 16px;
            color: #d0d0d0;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .hero-banner .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
        .btn.primary {
            background: #d0d0d0;
            border-color: #d0d0d0;
            color: #0a1929;
        }
        .btn.primary:hover {
            background: #e0e0e0;
            border-color: #e0e0e0;
        }
        .intro-section {
            text-align: center;
            padding: 50px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .intro-section h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #5eb3d1;
        }
        .intro-section p {
            font-size: 15px;
            line-height: 1.8;
            color: #9ca3af;
            margin-bottom: 15px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 40px auto;
        }
        .product-card {
            background: #1a2634;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            position: relative;
            transition: transform 0.3s, border-color 0.3s;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #5eb3d1;
        }
        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #1a5f7a;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .product-badge.subscription {
            background: #5eb3d1;
            color: #0a1929;
        }
        .product-image {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background: #0d1820;
            border-radius: 6px;
        }
        .product-card h3 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .product-card p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
            flex-grow: 1;
        }
        .features-section {
            background: rgba(26, 38, 52, 0.6);
            border-radius: 10px;
            padding: 50px;
            margin: 60px auto;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 35px;
            margin-top: 30px;
        }
        .feature-item h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #5eb3d1;
        }
        .feature-item p {
            font-size: 15px;
            line-height: 1.7;
            color: #9ca3af;
        }
        .trust-bar {
            background: #1a2634;
            border-top: 2px solid #2a3a4a;
            padding: 35px 0;
            margin-top: 60px;
        }
        .trust-bar .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            text-align: center;
        }
        .trust-item h4 {
            font-size: 17px;
            margin-bottom: 8px;
            color: #5eb3d1;
        }
        .trust-item p {
            font-size: 13px;
            color: #9ca3af;
        }
        footer {
            background: #050d15;
            text-align: center;
            padding: 25px;
            color: #6b7280;
            font-size: 13px;
        }
        @media (max-width: 992px) {
            .search-row .container {
                flex-direction: column;
                gap: 15px;
            }
            .search-bar {
                flex: 1 1 100%;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
            .features-grid {
                grid-template-columns: 1fr;
            }
            .trust-bar .container {
                grid-template-columns: 1fr;
            }
            .hero-content {
                padding: 30px 25px;
            }
            .hero-banner h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

</body>
</html>
